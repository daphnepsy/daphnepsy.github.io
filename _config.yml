# site settings
title: Daphne Poon
subtitle:
email: dpoon@hmc.edu
description: '' # empty, so the homepage tab title is just the site title
url: https://daphnepoon.com # matches CNAME
baseurl:

# footer links (icon is a Font Awesome 4 class)
social:
  - name: Twitter
    url: https://twitter.com/daphneeep
    icon: fa-twitter
  - name: GitHub
    url: https://github.com/daphnepsy
    icon: fa-github
  - name: LinkedIn
    url: https://www.linkedin.com/in/daphne-poon
    icon: fa-linkedin
  - name: Heart
    url: https://dipaolo.xyz
    icon: fa-heart-o

# projects
collections:
  projects:
    output: true
    permalink: /projects/:name

defaults:
  - scope:
      type: projects
    values:
      layout: project

# build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
sass:
  style: compressed
exclude:
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - vendor
